<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerenciador de Empresas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Gerenciador de Empresas</h1>
      <p class="subtitle">Lista de empresas e quantidade de funcionários</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Empresas</h2>

      <div class="table-wrap">
        <table class="company-table" aria-describedby="table-desc">
          <caption id="table-desc">Tabela com o nome da empresa e a quantidade de funcionários</caption>
          <thead>
            <tr>
              <th scope="col">Nome da Empresa</th>
              <th scope="col">Quantidade de Funcionários</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Tech Solutions</td>
              <td class="numeric">150</td>
            </tr>
            <tr>
              <td>Digital Innovations</td>
              <td class="numeric">87</td>
            </tr>
            <tr>
              <td>Cloud Systems</td>
              <td class="numeric">230</td>
            </tr>
            <tr>
              <td>Web Dynamics</td>
              <td class="numeric">45</td>
            </tr>
            <tr>
              <td>Software House</td>
              <td class="numeric">120</td>
            </tr>
            <tr>
              <td>Green AI Labs</td>
              <td class="numeric">32</td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>                                                                                      <!-- O setup inicial para o html responsivo é exatamente igual o da parte estática-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerenciador de Empresas</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <header>
            <h1>Gerenciador de Empresas</h1>                                                    <!-- mesmo header-->
        </header>

        <section class="form-container">                                                        <!-- tag semântica para formulário-->
            <h2>Adicionar Nova Empresa</h2>                                                     <!-- interface para criar novas empresas-->
            <form id="form-adicionar-empresa">                                                  <!-- define o tag de formulário e define um id único para o formulário-->
                <div class="form-group">                                                        
                    <label for="nome-empresa">Nome:</label>                                     <!-- cria um rótulo de ligação definida como "nome-empresa" e chama o label de "Nome:"-->
                    <input type="text" id="nome-empresa" placeholder="Ex: Nova Tech" required>  <!-- cria -o input ligado ao nome, define o tipo como texto e coloca um placeholder de exemplo-->
                </div>
                <div class="form-group">
                    <label for="qtd-funcionarios">Funcionários:</label>                         <!-- faz a mesma coisa para o input da quantidade de funcionários-->
                    <input type="number" id="qtd-funcionarios" placeholder="Ex: 50" required>
                </div>
                <button type="submit" class="btn-submit">Adicionar</button>                     <!-- cria um botão de adicionar de type submit e define a classe para estilizar ele depois-->
            </form>
        </section>                                                                              <!-- fecha a section e a parte do html do formulário-->

        <main>                                                                                  <!-- usa a mesma base do html estático-->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome da Empresa</th>
                            <th>Quantidade de Funcionários</th>
                            <th>Ações</th>                                                      <!-- cria agora uma coluna de ações para o CRUD-->
                        </tr>
                    </thead>
                    <tbody id="lista-empresas-corpo">                                           <!-- linka as linhas das colunas a um id que será mexido com o js-->
                    </tbody>
                </table>
            </div>
        </main>

        <script src="script.js" defer></script>                                                 <!-- carrega o arquivo script.js(que linka ao backend) e o defer serve para executar todo o html antes -->
        
        <div id="modal-edicao" class="modal-overlay" style="display: none;">                    <!-- div para carregar os pop-ups do site(tambem chamado de modal), class para o css e id para o js, o display none esconde o pop up -->
            <div class="modal-content">                                                         <!-- cria a caixa central do pop up-->
                <header class="modal-header">                                                   <!-- título para fazer a edição da empresa-->
                    <h2>Editar Empresa</h2>
                    <button id="btn-fechar-modal" class="btn-fechar">&times;</button>           <!-- o &times é o símbolo do x de fechar-->
                </header>
                
                <form id="form-editar-empresa">                                                 <!-- cria o formulário dentro do modal  -->
                    <input type="hidden" id="edit-empresa-id">                                  <!-- o type hidden é usado para guardar um dado importante que não é mostrada ao usuário (o id no caso)-->
                    
                    <div class="form-group">                                                    <!-- campos de nome qtd funcionários -->
                        <label for="edit-nome-empresa">Nome:</label>
                        <input type="text" id="edit-nome-empresa" required>                     <!-- o required diz que é obrigatório-->
                    </div>
                    <div class="form-group">
                        <label for="edit-qtd-funcionarios">Funcionários:</label>
                        <input type="number" id="edit-qtd-funcionarios" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-salvar">Salvar Alterações</button> <!-- cria um botão para salvar as ligações-->
                    </div>
                </form>
            </div>
        </div>

    </body>
</html>
